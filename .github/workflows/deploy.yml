name: Deploy to GitHub Pages

# Yayınlanan site: www.hund-katze-kaefer.de sitesinin orijinal hali
# (original-site/ klasöründeki statik dosyalar, sunucudan geldiği gibi).
# Angular sürümünü yayınlamak için: "Deploy Angular preview" workflow'unu elle çalıştır.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: original-site
      - id: deployment
        uses: actions/deploy-pages@v4
